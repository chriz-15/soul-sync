  <!-- Silhouette Left (Head & Body) -->
  <circle cx="36" cy="30" r="6" fill="#801323" />
  <path d="M26 48 C26 39 33 39 36 39 C39 39 46 39 46 48 L46 54 L26 54 Z" fill="#801323" />
  
  <!-- Silhouette Right (Head & Body) -->
  <circle cx="64" cy="30" r="6" fill="#801323" />
  <path d="M54 48 C54 39 61 39 64 39 C67 39 74 39 74 48 L74 54 L54 54 Z" fill="#801323" />
  
  <!-- Connected Holding Hands Arc -->
