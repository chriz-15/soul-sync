<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#801323" />
      <stop offset="50%" stop-color="#9E1B32" />
      <stop offset="100%" stop-color="#6B0F1E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Heart Outline -->
  <path d="M50 82 C20 58 10 42 10 28 C10 16 20 8 32 8 C40 8 46 12 50 18 C54 12 60 8 68 8 C80 8 90 16 90 28 C90 42 80 58 50 82 Z" 
