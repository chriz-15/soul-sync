<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E7E" />
      <stop offset="50%" stop-color="#C850C0" />
      <stop offset="100%" stop-color="#4158D0" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#121829" />
  <!-- Heart Outline -->
  <path d="M50 78 C25 56 16 42 16 30 C16 19 25 12 35 12 C42 12 47 16 50 21 C53 16 58 12 65 12 C75 12 84 19 84 30 C84 42 75 56 50 78 Z" 
        stroke="url(#neonGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)" />
  
  <!-- Silhouette Left -->
  <circle cx="38" cy="32" r="5" fill="url(#neonGrad)" />
  <path d="M29 48 C29 40 35 40 38 40 C41 40 47 40 47 48 L47 52 L29 52 Z" fill="url(#neonGrad)" />
  
  <!-- Silhouette Right -->
  <circle cx="62" cy="32" r="5" fill="url(#neonGrad)" />
  <path d="M53 48 C53 40 59 40 62 40 C65 40 71 40 71 48 L71 52 L53 52 Z" fill="url(#neonGrad)" />
  
  <!-- Handshake Connection -->
  <path d="M40 50 Q50 56 60 50" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
